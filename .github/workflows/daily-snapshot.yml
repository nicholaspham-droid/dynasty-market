name: Daily snapshot

on:
  schedule:
    # 11:20 UTC, roughly 7:20am Eastern. The odd minute keeps this off the
    # top of the hour when GitHub's scheduler is most congested and most
    # likely to delay or drop the run.
    - cron: "20 11 * * *"
  workflow_dispatch:

concurrency:
  group: snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Capture today's snapshot
        run: python scripts/fetch_snapshot.py --league-id "${{ vars.LEAGUE_ID }}"

      - name: Rebuild dataset
        run: python scripts/build_dataset.py --my-roster-id "${{ vars.MY_ROSTER_ID }}" --out docs/data.json

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots docs/data.json
          if git diff --staged --quiet; then
            echo "No change today."
          else
            git commit -m "Snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
